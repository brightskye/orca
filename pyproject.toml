[project]
name = "orca-memory"
version = "0.1.0"
description = "Governed local memory for Codex and other agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
orca = "orca_memory.cli:main"
orca-codex-hook = "orca_memory.codex_hook:main"

[project.optional-dependencies]
agentcairn = ["agentcairn==0.25.2"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
