name: Bug report
description: Report a reproducible Orca project defect without including private memory.
title: "Bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, vault contents, conversation evidence, or identifying personal data.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, using sanitized examples where needed?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction and relevant environment details.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, private memory, transcripts, credentials, and identifying data.
          required: true
